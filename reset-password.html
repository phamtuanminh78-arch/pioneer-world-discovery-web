<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khôi phục mật khẩu - Pioneer World Discovery</title>
<style>
body{margin:0;background:#f3f6fb;color:#17253d;font-family:Arial,sans-serif}
header{background:#173e73;color:white;padding:24px 15px;text-align:center}
main{max-width:430px;margin:25px auto;padding:0 16px}
section{background:white;padding:22px;border-radius:14px;box-shadow:0 3px 12px #0001}
input,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border-radius:8px;font-size:16px}
input{border:1px solid #cbd5e1}
button{border:0;background:#1761ad;color:white}
button:disabled{opacity:.5}
#message{overflow-wrap:anywhere}
a{color:#1761ad}
</style>
</head>
<body>
<header><h2>🌍 Pioneer World Discovery</h2><p>Khôi phục tài khoản</p></header>
<main><section>
<h2>Đặt mật khẩu mới</h2>
<p id="message" role="status">Đang kiểm tra liên kết khôi phục...</p>
<form id="form" hidden>
<input id="password" type="password" placeholder="Mật khẩu mới (ít nhất 8 ký tự)" minlength="8" required autocomplete="new-password">
<input id="confirm" type="password" placeholder="Nhập lại mật khẩu mới" minlength="8" required autocomplete="new-password">
<button id="save" type="submit">Lưu mật khẩu mới</button>
</form>
<p><a href="./auth.html">Trở về trang đăng nhập</a></p>
</section></main>
<script>
const SUPABASE_URL="https://fojmuyzpkongsrovualm.supabase.co";
const SUPABASE_KEY="sb_publishable_LZs9kuTRGoHsWhgdbL6COQ_KAw7BTHi";
const message=document.getElementById("message");
const form=document.getElementById("form");
let accessToken=null;
function show(text){message.textContent=text}
async function checkRecovery(){
 
if(!SUPABASE_KEY.startsWith("sb_publishable_LZs9kuTRGoHsWhgdbL6COQ_KAw7BTHi")){
  show("Chưa cấu hình Supabase Publishable Key.");
  return;
}

 const hash=new URLSearchParams(location.hash.slice(1));
 const query=new URLSearchParams(location.search);
 if(hash.get("type")==="recovery" && hash.get("access_token")){
  accessToken=hash.get("access_token");
 }else if(query.get("token_hash") && query.get("type")==="recovery"){
  const response=await fetch(SUPABASE_URL+"/auth/v1/verify",{
   method:"POST",
   headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},
   body:JSON.stringify({token_hash:query.get("token_hash"),type:"recovery"})
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.msg||data.message||"Liên kết không hợp lệ");
  accessToken=data.access_token;
 }else{
  throw new Error("Không tìm thấy phiên khôi phục hợp lệ. Hãy mở liên kết từ email mới.");
 }
 if(!accessToken)throw new Error("Không xác minh được phiên khôi phục.");
 history.replaceState(null,"",location.pathname);
 form.hidden=false;
 show("Liên kết hợp lệ. Hãy nhập mật khẩu mới.");
}
form.onsubmit=async(event)=>{
 event.preventDefault();
 const password=document.getElementById("password").value;
 const confirm=document.getElementById("confirm").value;
 if(password.length<8){show("Mật khẩu cần ít nhất 8 ký tự.");return}
 if(password!==confirm){show("Hai mật khẩu không trùng nhau.");return}
 const button=document.getElementById("save");
 button.disabled=true;
 try{
  const response=await fetch(SUPABASE_URL+"/auth/v1/user",{
   method:"PUT",
   headers:{
    "apikey":SUPABASE_KEY,
    "Authorization":"Bearer "+accessToken,
    "Content-Type":"application/json"
   },
   body:JSON.stringify({password})
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.msg||data.message||"Không thể đổi mật khẩu");
  accessToken=null;
  form.hidden=true;
  show("Đổi mật khẩu thành công! Hãy trở về trang đăng nhập.");
 }catch(error){show(error.message)}
 finally{button.disabled=false}
};
checkRecovery().catch(error=>show(error.message));
</script>
</body>
  </html>
