<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài viết của tôi - Pioneer World Discovery</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7f6;
  color: #222;
}

header {
  background: #163d35;
  color: white;
  padding: 20px;
  text-align: center;
}

header h2 {
  margin: 0 0 10px;
}

header p {
  margin: 0;
}

main {
  max-width: 800px;
  margin: 20px auto;
  padding: 15px;
}

nav {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  margin-bottom: 20px;
}

a {
  color: #176b52;
  text-decoration: none;
  font-weight: bold;
}

.story {
  background: white;
  padding: 16px;
  margin-bottom: 15px;
  border-radius: 12px;
  box-shadow: 0 2px 8px #00000012;
  overflow-wrap: anywhere;
}

.story h3 {
  margin-top: 0;
}

button {
  padding: 10px 16px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.edit-btn {
  background: #176b52;
  color: white;
}

.delete-btn {
  background: #dc3545;
  color: white;
}

#status {
  padding: 12px;
  background: white;
  border-radius: 8px;
}
  #editDialog {
  width: 92%;
  max-width: 520px;
  max-height: 85vh;
  overflow-y: auto;
  border: none;
  border-radius: 12px;
  padding: 20px;
  background: white;
  color: #222;
  box-shadow: 0 8px 30px rgba(0,0,0,0.25);
}

#editDialog::backdrop {
  background: rgba(0,0,0,0.55);
}

#editDialog h2 {
  margin-top: 0;
  color: #163d35;
}

#editForm label {
  display: block;
  margin-top: 12px;
  margin-bottom: 6px;
  font-weight: bold;
}

#editForm input,
#editForm textarea {
  width: 100%;
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 16px;
  font-family: inherit;
}

#editForm textarea {
  resize: vertical;
}

#editStatus {
  font-size: 14px;
  overflow-wrap: anywhere;
}

#saveEditBtn,
#cancelEditBtn {
  padding: 12px 16px;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
  margin-top: 10px;
}

#saveEditBtn {
  background: #163d35;
  color: white;
}

#cancelEditBtn {
  background: #e5e7eb;
  color: #333;
}
</style>
</head>

<body>

<header>
  <h2>🌍 Pioneer World Discovery</h2>
  <p>Bài viết của tôi</p>
</header>

<main>

  <nav>
    <a href="./">← Bảng tin</a>
    <a href="post.html">＋ Viết bài mới</a>
    <a href="auth.html">Tài khoản</a>
  </nav>

  <h2>Quản lý bài viết</h2>

  <p id="status" role="status">
    Đang chuẩn bị kết nối...
  </p>

  <div id="stories"></div>

</main>
  <dialog id="editDialog">
  <h2>✏️ Chỉnh sửa bài viết</h2>

  <form id="editForm">

    <label for="editTitle">Tiêu đề</label>
    <input id="editTitle" type="text" required>

    <label for="editContent">Nội dung</label>
    <textarea id="editContent" rows="6" required></textarea>

    <label for="editCountry">Quốc gia</label>
    <input id="editCountry" type="text">

    <label for="editCategory">Danh mục</label>
    <input id="editCategory" type="text">

    <label for="editImageUrl">Đường dẫn hình ảnh</label>
    <input id="editImageUrl" type="url">

    <p id="editStatus" role="status"></p>

    <button id="saveEditBtn" type="submit">
      💾 Lưu thay đổi
    </button>

    <button id="cancelEditBtn" type="button">
      Hủy bỏ
    </button>

  </form>
  </dialog>
<script>
const SUPABASE_URL =
  "https://fojmuyzpkongsrovualm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_LZs9kuTRGoHsWhgdbL6COQ_KAw7BTHi";

const SESSION_KEY = "pioneer-auth-session";

const statusEl = document.getElementById("status");
const storiesEl = document.getElementById("stories");

let accessToken = null;
let currentUserId = null;
const editDialog = document.getElementById("editDialog");
const editForm = document.getElementById("editForm");
const editTitle = document.getElementById("editTitle");
const editContent = document.getElementById("editContent");
const editCountry = document.getElementById("editCountry");
const editCategory = document.getElementById("editCategory");
const editImageUrl = document.getElementById("editImageUrl");
const editStatus = document.getElementById("editStatus");
const saveEditBtn = document.getElementById("saveEditBtn");
const cancelEditBtn = document.getElementById("cancelEditBtn");

let editingStoryId = null;
function show(message) {
  statusEl.textContent = message;
}
function openEditDialog(story) {
  editingStoryId = story.id;

  editTitle.value = story.title || "";
  editContent.value = story.content || "";
  editCountry.value = story.country || "";
  editCategory.value = story.category || "";
  editImageUrl.value = story.image_url || "";

  editStatus.textContent = "";
  saveEditBtn.disabled = false;

  editDialog.showModal();
  }
function getSession() {
  try {
    return JSON.parse(
      localStorage.getItem(SESSION_KEY) || "null"
    );
  } catch (error) {
    return null;
  }
}
  async function refreshStoriesSession(session) {
  if (!session?.refresh_token) {
    throw new Error("Bạn cần đăng nhập lại.");
  }

  const response = await fetch(
    SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token",
    {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        refresh_token: session.refresh_token
      })
    }
  );

  const data = await response.json();

  if (
    !response.ok ||
    !data.access_token ||
    !data.refresh_token
  ) {
    throw new Error("Không thể làm mới phiên đăng nhập.");
  }

  localStorage.setItem(
    SESSION_KEY,
    JSON.stringify(data)
  );

  return data;
  }
  async function verifyStoriesSession() {
  let session = getSession();

  if (
    !session?.access_token &&
    !session?.refresh_token
  ) {
    throw new Error("Bạn cần đăng nhập trước.");
  }

  if (
    !session.access_token ||
    (
      session.expires_at &&
      Math.floor(Date.now() / 1000) >=
      session.expires_at - 60
    )
  ) {
    session = await refreshStoriesSession(session);
  }

  let response = await fetch(
    SUPABASE_URL + "/auth/v1/user",
    {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + session.access_token
      }
    }
  );

  if (
    response.status === 401 &&
    session.refresh_token
  ) {
    session = await refreshStoriesSession(session);

    response = await fetch(
      SUPABASE_URL + "/auth/v1/user",
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: "Bearer " + session.access_token
        }
      }
    );
  }

  if (!response.ok) {
    throw new Error("Không thể xác minh phiên đăng nhập.");
  }

  const user = await response.json();

  if (!user.id) {
    throw new Error("Không xác định được tài khoản.");
  }

  accessToken = session.access_token;
  currentUserId = user.id;

  return user;
  }
  async function loadMyStories() {
  storiesEl.replaceChildren();

  show("Đang tải bài viết của bạn...");

  try {
    await verifyStoriesSession();

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/stories?select=*" +
      "&author_id=eq." +
      encodeURIComponent(currentUserId) +
      "&order=created_at.desc",
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: "Bearer " + accessToken
        }
      }
    );

    if (!response.ok) {
      throw new Error("Không thể tải bài viết.");
    }

    const stories = await response.json();

    if (!Array.isArray(stories)) {
      throw new Error("Dữ liệu không hợp lệ.");
    }

    if (stories.length === 0) {
      show("Bạn chưa có bài viết nào.");
      return;
    }

    stories.forEach(function(story) {
      const card = document.createElement("article");
      card.className = "story-card";

      const title = document.createElement("h3");
      title.textContent = story.title;

      const content = document.createElement("p");
      content.textContent = story.content;

      const meta = document.createElement("p");
      meta.textContent =
        (story.country || "") + " | " +
        (story.category || "");

      card.append(title, content, meta);
      const actions = document.createElement("div");

actions.style.display = "flex";
actions.style.gap = "10px";
actions.style.marginTop = "12px";

const editBtn = document.createElement("button");
editBtn.type = "button";
editBtn.textContent = "✏️ Sửa bài viết";
editBtn.style.background = "#2563eb";

const deleteBtn = document.createElement("button");
deleteBtn.type = "button";
deleteBtn.textContent = "🗑️ Xóa bài viết";
deleteBtn.style.background = "#dc2626";

[editBtn, deleteBtn].forEach(function(btn) {
  btn.style.color = "white";
  btn.style.border = "none";
  btn.style.padding = "10px 14px";
  btn.style.borderRadius = "6px";
  btn.style.cursor = "pointer";
  btn.style.flex = "1";
});
editBtn.addEventListener("click", function() {
  openEditDialog(story);
});
actions.append(editBtn, deleteBtn);
card.appendChild(actions);
      storiesEl.appendChild(card);
    });

    show("Bạn có " + stories.length + " bài viết.");

  } catch (error) {
    storiesEl.replaceChildren();
    show(error.message);
  }
}
cancelEditBtn.addEventListener("click", function() {
  editDialog.close();
  editingStoryId = null;
  editStatus.textContent = "";
});
  editForm.addEventListener("submit", async function(event) {
  event.preventDefault();

  if (!editingStoryId || saveEditBtn.disabled) {
    return;
  }

  const storyId = editingStoryId;

  const updatedStory = {
    title: editTitle.value.trim(),
    content: editContent.value.trim(),
    country: editCountry.value.trim(),
    category: editCategory.value.trim(),
    image_url: editImageUrl.value.trim() || null
  };

  if (!updatedStory.title || !updatedStory.content) {
    editStatus.textContent = "Vui lòng nhập tiêu đề và nội dung.";
    return;
  }

  saveEditBtn.disabled = true;
  cancelEditBtn.disabled = true;
  editStatus.textContent = "Đang lưu thay đổi...";

  function preventClose(event) {
    event.preventDefault();
  }

  editDialog.addEventListener("cancel", preventClose);

  try {
    await verifyStoriesSession();

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/stories?id=eq." +
      encodeURIComponent(storyId) +
      "&author_id=eq." +
      encodeURIComponent(currentUserId),
      {
        method: "PATCH",
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: "Bearer " + accessToken,
          "Content-Type": "application/json",
          Prefer: "return=representation"
        },
        body: JSON.stringify(updatedStory)
      }
    );

    if (!response.ok) {
      throw new Error("Không thể lưu thay đổi.");
    }

    const result = await response.json();

    if (!Array.isArray(result) || result.length !== 1) {
      throw new Error("Không tìm thấy bài viết được phép sửa.");
    }

    editingStoryId = null;
    editDialog.close();

    await loadMyStories();

    alert("Đã lưu thay đổi thành công!");

  } catch (error) {
    editStatus.textContent = error.message;
  } finally {
    saveEditBtn.disabled = false;
    cancelEditBtn.disabled = false;
    editDialog.removeEventListener("cancel", preventClose);
  }
});
loadMyStories();
</script>
</body>
  </html>
