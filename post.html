
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng bài - Pioneer World Discovery</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
      color: #17243a;
    }
    header {
      background: #193f70;
      color: white;
      padding: 38px 16px;
      text-align: center;
    }
    header h1 { font-size: 26px; }
    main {
      max-width: 650px;
      margin: 30px auto;
      padding: 0 16px;
    }
    section {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px #0000000d;
    }
    h2 { font-size: 25px; }
    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }
    input, textarea, select {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font: inherit;
    }
    textarea {
      min-height: 160px;
      resize: vertical;
    }
    button {
      width: 100%;
      padding: 15px;
      margin-top: 22px;
      border: none;
      border-radius: 9px;
      background: #2165a8;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    a { color: #2165a8; }
    #message {
      margin-top: 18px;
      overflow-wrap: anywhere;
    }
    .links { margin-top: 20px; }
  </style>
</head>
<body>

<header>
  <h1>🌍 Pioneer World Discovery</h1>
  <p>Chia sẻ khám phá cùng cộng đồng</p>
</header>

<main>
  <section>
    <h2>✍️ Viết bài mới</h2>

    <p id="status">Đang kiểm tra đăng nhập...</p>

    <form id="postForm" hidden>

      <label for="title">Tiêu đề *</label>
      <input id="title" required maxlength="150">

      <label for="country">Quốc gia</label>
      <input id="country" maxlength="100"
        placeholder="Ví dụ: Việt Nam">

      <label for="category">Danh mục</label>
      <select id="category">
        <option value="Khám phá">Khám phá</option>
        <option value="Du lịch">Du lịch</option>
        <option value="Văn hóa">Văn hóa</option>
        <option value="Thiên nhiên">Thiên nhiên</option>
        <option value="Cộng đồng">Cộng đồng</option>
      </select>

      <label for="content">Nội dung bài viết *</label>
      <textarea id="content" required
        placeholder="Chia sẻ câu chuyện của bạn..."></textarea>

      <label for="image_url">Đường dẫn ảnh (không bắt buộc)</label>
      <input id="image_url" type="url"
        placeholder="https://example.com/photo.jpg">

      <button id="submitBtn" type="submit">
        Đăng bài
      </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <div class="links">
      <p><a href="./auth.html">Tài khoản / Đăng nhập</a></p>
      <p><a href="./">← Trở về Bảng tin</a></p>
    </div>
  </section>
</main>

<script>
const SUPABASE_URL =
  "https://fojmuyzpkongsrovualm.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_LZs9kuTRGoHsWhgdbL6COQ_KAw7BTHi";

const SESSION_KEY = "pioneer-auth-session";

const form = document.getElementById("postForm");
const statusEl = document.getElementById("status");
const messageEl = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");

let accessToken = null;
let currentUserId = null;

function show(text) {
  messageEl.textContent = text;
}

function getSession() {
  try {
    return JSON.parse(
      localStorage.getItem(SESSION_KEY) || "null"
    );
  } catch {
    return null;
  }
}


async function refreshPostSession(session) {
  if (!session?.refresh_token) {
    throw new Error("Không có refresh token.");
  }

  const response = await fetch(
    SUPABASE_URL + "/auth/v1/token?grant_type=refresh_token",
    {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        refresh_token: session.refresh_token
      })
    }
  );

  const data = await response.json();

  if (!response.ok || !data.access_token || !data.refresh_token) {
    throw new Error(
      data.error_description ||
      data.msg ||
      "Không thể làm mới phiên đăng nhập."
    );
  }

  localStorage.setItem(
    SESSION_KEY,
    JSON.stringify(data)
  );

  return data;
}
async function initialize() {
  if (!SUPABASE_KEY.startsWith("sb_publishable_")) {
    statusEl.textContent = "Chưa cấu hình Publishable Key.";
    return;
  }

  const session = getSession();

  if (!session || !session.access_token) {
    statusEl.textContent =
      "Bạn cần đăng nhập trước khi viết bài.";
    return;
  }

  try {
    const response = await fetch(
      SUPABASE_URL + "/auth/v1/user",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + session.access_token
        }
      }
    );

    
if (!response.ok) {
  if (response.status === 401) {
    const latestSession = getSession();

    if (
      latestSession?.access_token &&
      latestSession.access_token !== session.access_token
    ) {
      accessToken = latestSession.access_token;
    } else {
      const refreshed = await refreshPostSession(session);
      accessToken = refreshed.access_token;
    }

    const retryResponse = await fetch(
      SUPABASE_URL + "/auth/v1/user",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + accessToken
        }
      }
    );

    if (!retryResponse.ok) {
      throw new Error("Không thể xác minh phiên đăng nhập mới.");
    }

    const refreshedUser = await retryResponse.json();

    if (!refreshedUser.id) {
      throw new Error("Không xác định được tài khoản.");
    }

    currentUserId = refreshedUser.id;
    statusEl.textContent = "Đã đăng nhập. Bạn có thể viết bài.";
    form.hidden = false;
    return;
  }

  throw new Error("Không thể xác minh phiên đăng nhập.");
}


    const user = await response.json();

    if (!user.id) {
      throw new Error("Không xác định được tài khoản.");
    }

    accessToken = session.access_token;
    currentUserId = user.id;

    statusEl.textContent =
      "Đã đăng nhập. Bạn có thể viết bài.";
    form.hidden = false;

  } catch (error) {
    statusEl.textContent = error.message;
    show("Hãy quay về trang đăng nhập.");
  }
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  if (!accessToken || !currentUserId) {
    show("Bạn cần đăng nhập.");
    return;
  }

  const title =
    document.getElementById("title").value.trim();

  const content =
    document.getElementById("content").value.trim();

  const country =
    document.getElementById("country").value.trim();

  const category =
    document.getElementById("category").value;

  const imageUrl =
    document.getElementById("image_url").value.trim();

  if (!title || !content) {
    show("Vui lòng nhập tiêu đề và nội dung.");
    return;
  }

  const story = {
    author_id: currentUserId,
    title: title,
    content: content,
    country: country || null,
    category: category,
    image_url: imageUrl || null
  };

  submitBtn.disabled = true;
  show("Đang đăng bài...");

  try {
    const response = await fetch(
      SUPABASE_URL + "/rest/v1/stories",
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + accessToken,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify(story)
      }
    );

    if (!response.ok) {
      const errorData = await response.json()
        .catch(() => ({}));

      throw new Error(
        errorData.message ||
        "Không thể đăng bài. Mã lỗi: " + response.status
      );
    }

    show("🎉 Đăng bài thành công!");
    form.reset();

  } catch (error) {
    show("Lỗi: " + error.message);
  } finally {
    submitBtn.disabled = false;
  }
});

initialize();
</script>

</body>
</html>
